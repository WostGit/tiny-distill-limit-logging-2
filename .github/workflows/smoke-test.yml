name: tiny-distill-smoke-test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tiny distillation training
        run: |
          python scripts/train_tiny_distill.py \
            --train-file data/tiny_train.jsonl \
            --output-dir outputs/checkpoint \
            --metrics-path outputs/metrics/train_metrics.json

      - name: Run tiny distillation evaluation
        run: |
          python scripts/eval_tiny_distill.py \
            --eval-file data/tiny_eval.jsonl \
            --adapter-dir outputs/checkpoint \
            --metrics-path outputs/metrics/eval_metrics.json

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-distill-metrics
          path: outputs/metrics/*.json
          if-no-files-found: error
